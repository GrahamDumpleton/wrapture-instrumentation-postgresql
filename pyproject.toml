[build-system]
requires = ["setuptools>=62.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wrapture-instrumentation-postgresql"
dynamic = ["version"]
description = "Instrumentation for the PostgreSQL client libraries (psycopg, psycopg2), applied through wrapture."
readme = "README.md"
license = "BSD-2-Clause"
license-files = ["LICENSE"]
authors = [
    {name = "Graham Dumpleton", email = "Graham.Dumpleton@gmail.com"}
]
requires-python = ">=3.12"
keywords = ["wrapture", "instrumentation", "postgresql", "psycopg", "psycopg2", "tracing"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
]
# wrapture is the only dependency, ever. An instrumentation package
# never depends on the packages it instruments: installing it must not
# install psycopg, and whether a driver is present and at a supported
# version is checked by wrapture at apply time from the class data.
dependencies = [
    "wrapture>=1.0.0a20",
]

[project.urls]
Homepage = "https://github.com/GrahamDumpleton/wrapture-instrumentation-postgresql"
Documentation = "https://wrapture.readthedocs.io"
"Bug Tracker" = "https://github.com/GrahamDumpleton/wrapture-instrumentation-postgresql/issues/"

# One entry per target, the entry point name being the bare target
# name the config's [[instrument]] entry uses. The group name has a
# dot in it, hence the quoted header.
[project.entry-points."wrapture.instrumentation"]
psycopg = "wrapture_instrumentation_postgresql.psycopg:PsycopgInstrumentation"

[tool.setuptools]
package-dir = {"" = "src"}
zip-safe = false

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
wrapture_instrumentation_postgresql = ["py.typed", "*/README.md"]

[tool.setuptools.dynamic]
version = {attr = "wrapture_instrumentation_postgresql.__version__"}

[dependency-groups]
# The test group carries the drivers at whatever version the lock
# resolves, and the core wrapture instrumentation package for the
# sqlalchemy target the composition tests compose against. psycopg's
# pure Python implementation installs everywhere and needs a libpq on
# the machine (the docker test runner supplies one); psycopg-binary
# bundles its own libpq and has wheels up to 3.14, so on those
# versions psycopg picks it up and nothing need be installed locally.
# The wheel-only drivers carry a marker for the versions their wheels
# cover, and their suites skip themselves where the import fails.
test = [
    "psycopg",
    "psycopg-binary; python_version < '3.15'",
    "psycopg-pool",
    "pytest",
    "sqlalchemy",
    "wrapture-instrumentation",
]
dev = [
    {include-group = "test"},
    "mypy",
    "ruff",
    "setuptools",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/wrapture_instrumentation_postgresql", "tests", "demo"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
]

[tool.ruff.lint.isort]
known-first-party = ["wrapture_instrumentation_postgresql"]

# The target suites guard their imports behind importorskip, so their
# module-level imports legitimately follow that statement.
[tool.ruff.lint.per-file-ignores]
"tests/psycopg/*" = ["E402"]
